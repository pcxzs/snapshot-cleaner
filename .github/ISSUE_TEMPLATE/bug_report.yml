name: Bug report
description: Something behaved wrongly, crashed, or reported the wrong numbers
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this involves data loss or a snapshot left writable, please report it
        privately instead: see [SECURITY.md](https://github.com/pcxzs/snapshot-cleaner/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `sudo snapshot-cleaner doctor`
      description: This reports the detected layout and which measurement methods work on your system. It answers most detection and layout questions on its own.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `snapshot-cleaner --version`.
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel and distribution
      description: Output of `uname -r`, plus your distribution.
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Snapshot layout
      options:
        - Timeshift
        - snapper
        - btrbk
        - manual (pair = ... in the config)
        - unknown / not detected
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Debug log
      description: "Optional but the fastest route to a fix: `make debug`, run `./snapshot-cleaner-debug <your command>`, and attach the log file it prints on exit."
